<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Glass Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <div class="img-box">
            <img src="img/sneaker.png" alt="Sneaker">
        </div>

        <h2>Nike Air Max</h2>
        <p>Experience the ultimate fusion of style and futuristic comfort.</p>

        <div class="price"><span>$</span>129.99</div>

        <div class="size">
            <span>7</span>
            <span>8</span>
            <span>9</span>
            <span>10</span>
        </div>

        <button>Buy Now</button>
    </div>
</body>

</html>
